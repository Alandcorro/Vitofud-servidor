<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos</title>
<link rel="stylesheet" href="/base.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
header{padding:2vh 3vw;display:flex;align-items:center;gap:2vw}
header h1{font-size:clamp(26px,4vw,56px);font-weight:800;letter-spacing:-.02em;flex:1}
#cx{font-size:clamp(14px,1.6vw,22px);font-weight:700;color:var(--bad);display:none}
#cx.on{display:block}
#cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vw;padding:0 3vw 3vh;min-height:0}
section{background:var(--panel);border-radius:2vw;padding:2vw;overflow:hidden;display:flex;flex-direction:column;gap:1.5vh;box-shadow:inset 0 0 0 1px var(--line)}
section h2{font-size:clamp(22px,3.4vw,46px)}
section.l h2{color:var(--ok)}
.n{display:flex;flex-wrap:wrap;gap:1.4vw;align-content:flex-start;overflow:hidden}
.n div{background:var(--panel2);border-radius:1.4vw;padding:1vh 2vw;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.n b{display:block;font-size:clamp(40px,8vw,120px);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.n span{font-size:clamp(14px,1.7vw,24px);color:var(--muted);font-weight:700}
section.l .n div{background:var(--ok);color:#fff;box-shadow:none}section.l .n span{color:#fff}
section.l .n div.nuevo{animation:parp 1s 6}
@keyframes parp{50%{transform:scale(1.08)}}
.vac{color:var(--muted);font-size:clamp(16px,2vw,28px)}
@media (max-width:700px){#cols{grid-template-columns:1fr;overflow-y:auto}html,body{overflow:auto}}
</style>
</head>
<body>
<header><h1 id="local">Turnos</h1><span id="cx">Sin conexión con el servidor…</span></header>
<div id="cols"><section><h2>Preparando</h2><div class="n" id="prep"></div></section><section class="l"><h2>Listos para retirar</h2><div class="n" id="listos"></div></section></div>
<script src="/comun.js"></script>
<script>
var $=function(i){return document.getElementById(i)},vistos=null,lastOk=Date.now();
function lista(a,nuevos){return a.length?a.map(function(o){return'<div'+(nuevos&&nuevos[o.num]?' class="nuevo"':'')+'><b>'+o.num+'</b><span>'+esc(etiquetaMesa(o.mesa))+'</span></div>'}).join(''):'<p class="vac">'+(nuevos===undefined?'Sin pedidos':'Todavía no hay pedidos listos')+'</p>'}
function poll(){
  fetch('/api/turnos',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    lastOk=Date.now();
    var nuevos={};d.listos.forEach(function(o){if(vistos&&!vistos[o.num])nuevos[o.num]=1});
    vistos={};d.listos.forEach(function(o){vistos[o.num]=1});
    $('prep').innerHTML=lista(d.preparando);$('listos').innerHTML=lista(d.listos,nuevos);
  }).catch(function(){});
  $('cx').classList.toggle('on',Date.now()-lastOk>6000);
}
fetch('/api/config').then(function(r){return r.json()}).then(function(c){$('local').textContent=c.local});
poll();setInterval(poll,2000);
</script>
</body>
</html>
